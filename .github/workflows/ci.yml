name: CI

# Mirror of this repository's GitLab CI validation jobs, published on GitHub purely for public
# visibility (GitLab remains the source of truth for development — see CONTRIBUTING.md). Only
# the correctness-signal jobs are mirrored here; release automation and anything else specific
# to the GitLab workflow stays GitLab-only.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # They had drifted (a follow-up file that did not exist, and an "evidence" key the
      # importer ignores). Validate them, plus the helper shell scripts.
      - run: node scripts/validate-examples.cjs
      - run: node scripts/domain-rules.mjs verify
      - run: node scripts/verify-endpoints.mjs
      - run: node scripts/verify-closure-date.mjs
      - run: node scripts/verify-operator-attribution.mjs
      - run: node scripts/verify-report-headers.mjs
      - run: node scripts/verify-report-versioning.mjs
      - run: bash scripts/verify-vso-security.sh
      - run: bash scripts/verify-error-describer.sh
      - name: Syntax-check every shell script
        run: |
          for script in scripts/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done

  security-scan:
    # Supply-chain scanning (P3.2). Gate policy chosen from measurement:
    # CRITICAL and HIGH both block, fixable-only. P3.2 shipped with HIGH merely
    # reported while 33 fixable findings were cleared, because a gate that is
    # red on arrival gets switched off and a disabled gate still reads as
    # protection. That backlog is cleared (0/0 across all six repos,
    # 2026-09-29), so the bar rises. --ignore-unfixed keeps an unfixable new
    # advisory from blocking anyone; a fixable one that cannot be taken now
    # goes in .trivyignore with a reason and a date, never by weakening this
    # job. --skip-dirs excludes generated/bind-mounted runtime trees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report CRITICAL and HIGH
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '0'
      - name: Fail on any fixable CRITICAL or HIGH
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '1'
