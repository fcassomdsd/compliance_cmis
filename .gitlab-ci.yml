stages:
  - lint
  - validate
  - release

# Guards against the parse errors the previous ecmaVersion: 5 config silently
# allowed: `npm run lint` is now a required check on every merge request.
lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# The example payloads are the contract documentation for most endpoints, and
# they had drifted (a follow-up file that did not exist, and an "evidence" key
# the importer ignores). Validate them, plus the helper shell scripts.
validate:examples:
  stage: validate
  image: node:20-alpine
  before_script:
    - apk add --no-cache bash
  script:
    - node scripts/validate-examples.cjs
    - node scripts/domain-rules.mjs verify
    - bash scripts/verify-vso-security.sh
    - |
      for script in scripts/*.sh; do
        echo "bash -n $script"
        bash -n "$script"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

compute_release_tag:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "RELEASE_TAG=$(date +%Y-%m-%d)" >> release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    description: "Release $RELEASE_TAG"
    ref: '$CI_COMMIT_SHA'
