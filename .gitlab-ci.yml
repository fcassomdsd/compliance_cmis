stages:
  - lint
  - validate
  - release

# Guards against the parse errors the previous ecmaVersion: 5 config silently
# allowed: `npm run lint` is now a required check on every merge request.
lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# The example payloads are the contract documentation for most endpoints, and
# they had drifted (a follow-up file that did not exist, and an "evidence" key
# the importer ignores). Validate them, plus the helper shell scripts.
validate:examples:
  stage: validate
  image: node:20-alpine
  before_script:
    - apk add --no-cache bash
  script:
    - node scripts/validate-examples.cjs
    - node scripts/domain-rules.mjs verify
    - node scripts/verify-endpoints.mjs
    - node scripts/verify-closure-date.mjs
    - node scripts/verify-report-headers.mjs
    - bash scripts/verify-vso-security.sh
    - |
      for script in scripts/*.sh; do
        echo "bash -n $script"
        bash -n "$script"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Releases are CalVer-tagged from CHANGELOG.md and gated on a prepared release
# entry: the tag is the date of the newest "## [YYYY-MM-DD]" section, the
# pipeline fails when that section is missing, when CHANGELOG.md is unchanged
# since the previous release, or when the tag already exists. The CHANGELOG is
# the release trigger: a merge to the default branch that does not touch
# CHANGELOG.md produces no release. See scripts/release-tag.sh and
# CONTRIBUTING.md ("Versioning and releases").
compute_release_tag:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - sh scripts/release-tag.test.sh
    - sh scripts/release-tag.sh --env-file release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    ref: '$CI_COMMIT_SHA'
    description: 'See CHANGELOG.md for the changes in $RELEASE_TAG'
