# This Docker Compose file will spin up an ACS community installation on a local host.
# It requires at least 6GB of memory available to distribute among containers.
#
# NOTE: Alfresco Community Edition only publishes the two most recent versions.
# The image tags used here will eventually become unavailable for download.
# For long-term reproducibility, consider docker save/load or a private registry.
#
# For performance tuning, increase each container mem_limit and give a percentage of
# it to the JVM. Use either the -Xms,-Xmx flags or the newly added flags in
# java 10+: -XX:MaxRAMPercentage and -XX:MinRAMPercentage.
# More details here:
# https://www.oracle.com/technetwork/java/javase/10-relnote-issues-4108729.html
#
services:
  alfresco:
    image: alfresco/alfresco-governance-repository-community:25.2.0@sha256:a795f678d79da93c0988927e36d26d087b1b6bd009465d4a647a8f13e5eb9198
    # 1900m left ~145m of headroom above the JVM's 80%-of-limit heap ceiling, and
    # FOOTPRINT_AUDIT.md (2026-09-15) measured it idling at 1.759-1.799 GiB of that
    # 1.855 GiB cap -- already 95-97% utilized before any real load. Raised so plan/
    # report generation and larger imports have room to run without GC-thrashing or
    # OOM-killing the container. See FOOTPRINT_AUDIT.md "Actions this audit suggests" #1.
    mem_limit: 2560m
    # Container hardening (P3.2). read_only and a non-root `user:` are NOT
    # applied to this stack: these are JVM services that write caches, logs,
    # indexes and temp files inside their own filesystems, and Alfresco in
    # particular writes into the bind-mounted content store as the uid its
    # image defines. Forcing either would break the stack rather than harden
    # it. no-new-privileges, a restart policy and the memory caps above are
    # the controls that apply without changing how these images work.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=${METADATA_KEYSTORE_PASSWORD:?METADATA_KEYSTORE_PASSWORD is required. Copy .env.example to .env and set it. Changing it on an existing instance makes stored metadata undecryptable.}
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=${METADATA_KEYSTORE_METADATA_PASSWORD:?METADATA_KEYSTORE_METADATA_PASSWORD is required. Copy .env.example to .env and set it. Changing it on an existing instance makes stored metadata undecryptable.}
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env and set it}
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=solr6
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=${SOLR_SECRET:?SOLR_SECRET is required. Copy .env.example to .env and set it. It must match on the alfresco and solr6 services}
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dsmart.folders.enabled=true
        -Dcsrf.filter.enabled=true
        -Dcsrf.filter.referer=/share/.*
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dsystem.webdav.servlet.enabled=true
        -Dsystem.webdav.rootPath=/app:company_home
        -Dsystem.webdav.activities.enabled=true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 1m
    volumes:
      - ./data/alf_data:/usr/local/tomcat/alf_data
      - ./configs/model/vsoModel.xml:/usr/local/tomcat/shared/classes/alfresco/extension/model/vsoModel.xml
      - ./configs/model/vso-bootstrap-context.xml:/usr/local/tomcat/shared/classes/alfresco/extension/vso-bootstrap-context.xml
      - ./configs/messages/vsoModel:/usr/local/tomcat/shared/classes/alfresco/extension/vsoModel.properties
      - ./configs/messages/vsoModel_es:/usr/local/tomcat/shared/classes/alfresco/extension/vsoModel_es.properties
      - ./configs/entity-profile.json:/usr/local/tomcat/shared/classes/alfresco/extension/entity-profile.json
      - ./configs/entity-logo.png:/usr/local/tomcat/shared/classes/alfresco/extension/entity-logo.png:ro
      - ./configs/module.properties:/usr/local/tomcat/shared/classes/alfresco/extension/module.properties
      - ./webscripts:/usr/local/tomcat/shared/classes/alfresco/extension/templates/webscripts
    extends:
      file: commons/base.yaml
      service: alfresco
    networks:
      - alfresco_net
      - backend_net

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.2.0@sha256:694810dd0a9ab91abdb700419dac84dcead2d8c15c5646102bc6e140897c607f
    mem_limit: 1536m
    # Container hardening (P3.2). read_only and a non-root `user:` are NOT
    # applied to this stack: these are JVM services that write caches, logs,
    # indexes and temp files inside their own filesystems, and Alfresco in
    # particular writes into the bind-mounted content store as the uid its
    # image defines. Forcing either would break the stack rather than harden
    # it. no-new-privileges, a restart policy and the memory caps above are
    # the controls that apply without changing how these images work.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 10s
    depends_on:
      activemq:
        condition: service_healthy
    networks:
      - alfresco_net

  share:
    image: alfresco/alfresco-governance-share-community:25.2.0@sha256:0c36b2f91b1e272a47d579a0213e49c1ede4bd0c42c5f3b9b0c4ec1285f7bfff
    mem_limit: 1g
    # Container hardening (P3.2). read_only and a non-root `user:` are NOT
    # applied to this stack: these are JVM services that write caches, logs,
    # indexes and temp files inside their own filesystems, and Alfresco in
    # particular writes into the bind-mounted content store as the uid its
    # image defines. Forcing either would break the stack rather than harden
    # it. no-new-privileges, a restart policy and the memory caps above are
    # the controls that apply without changing how these images work.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CSRF_FILTER_ORIGIN: http://localhost:8080
      CSRF_FILTER_REFERER: http://localhost:8080/share/.*
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 15s
    depends_on:
      alfresco:
        condition: service_healthy
    extends:
      file: commons/base.yaml
      service: share
    volumes:
      - ./configs/share:/usr/local/tomcat/shared/classes/alfresco/web-extension
    networks:
      - alfresco_net

  postgres:
    image: postgres:${POSTGRES_TAG:-16.5}@${POSTGRES_DIGEST:-sha256:53f3e608f9475ce120ced2d0f430b89458d7faa28530e0b0977a6af64d294877}
    mem_limit: 512m
    # Container hardening (P3.2). read_only and a non-root `user:` are NOT
    # applied to this stack: these are JVM services that write caches, logs,
    # indexes and temp files inside their own filesystems, and Alfresco in
    # particular writes into the bind-mounted content store as the uid its
    # image defines. Forcing either would break the stack rather than harden
    # it. no-new-privileges, a restart policy and the memory caps above are
    # the controls that apply without changing how these images work.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env and set it}
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
    networks:
      - alfresco_net

  solr6:
    image: alfresco/alfresco-search-services:2.0.16@sha256:107c08ad87b69812c57bff64e718c859e2d4713acf293b9af2fcb1cf92a7d7b3
    mem_limit: 2g
    # Container hardening (P3.2). read_only and a non-root `user:` are NOT
    # applied to this stack: these are JVM services that write caches, logs,
    # indexes and temp files inside their own filesystems, and Alfresco in
    # particular writes into the bind-mounted content store as the uid its
    # image defines. Forcing either would break the stack rather than harden
    # it. no-new-privileges, a restart policy and the memory caps above are
    # the controls that apply without changing how these images work.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Solr needs to know how to register itself with Alfresco
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      # Alfresco needs to know how to call solr
      SOLR_SOLR_HOST: "solr6"
      SOLR_SOLR_PORT: "8983"
      # Create the default alfresco and archive cores
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      # HTTPS or SECRET
      ALFRESCO_SECURE_COMMS: "secret"
      # SHARED SECRET VALUE
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=${SOLR_SECRET:?SOLR_SECRET is required. Copy .env.example to .env and set it. It must match on the alfresco and solr6 services}
    ports:
      - "8083:8983" # Browser port
    networks:
      - alfresco_net

  activemq:
    image: alfresco/alfresco-activemq:5.18-jre17-rockylinux8@sha256:ecc4769fb9eb9bd064da24eb3a722975f3ac7b4ffc35dfb178199f5181051941
    mem_limit: 1g
    # Container hardening (P3.2). read_only and a non-root `user:` are NOT
    # applied to this stack: these are JVM services that write caches, logs,
    # indexes and temp files inside their own filesystems, and Alfresco in
    # particular writes into the bind-mounted content store as the uid its
    # image defines. Forcing either would break the stack rather than harden
    # it. no-new-privileges, a restart policy and the memory caps above are
    # the controls that apply without changing how these images work.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8161:8161" # Web Console
      - "5672:5672" # AMQP
      - "61616:61616" # OpenWire
      - "61613:61613" # STOMP
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health", "|", "grep", "Good"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - alfresco_net

  proxy:
    extends:
      file: commons/base.yaml
      service: proxy
    networks:
      - alfresco_net
      - backend_net

networks:
  alfresco_net:
    driver: bridge
  backend_net:
    name: alfresco_backend

